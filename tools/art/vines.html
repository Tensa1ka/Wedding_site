<!doctype html>
<html data-scale="1.2"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#art{display:block;width:1400px;height:760px}</style></head>
<body>
<!-- Свисающие ветви эвкалипта для глубины фона обложки (размыты) -->
<svg id="art" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="ornament.js"></script><script src="flora.js"></script>
<script>
  const svg = document.getElementById('art'); const defs = setupDefs(svg);
  defs.insertAdjacentHTML('beforeend', '<filter id="depth" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>');
  const g = el('g', { filter: 'url(#depth)' }, svg);
  seedRnd(12);
  // ветвь с узкими листьями (как ива/олива), листья чередуются и чуть свисают
  function vine(pts, size, key) {
    stem(g, pts, 1.6, '#8f9a88');
    const P = PAL[key];
    for (let i = 3; i < pts.length - 1; i += 3) {
      const p = pts[i], q = pts[i + 1];
      const a = Math.atan2(q[1] - p[1], q[0] - p[0]);
      const side = (i / 3) % 2 ? 1 : -1;
      const L = size * (1 - i / pts.length * .45) * (.8 + rnd() * .4);
      const fill = rnd() < .5 ? P.mid : P.hi;
      el('path', { d: leaf(p[0], p[1], L, L * .3, a + side * (1.0 + rnd() * .4), side * .3), fill, opacity: .95 }, g);
    }
  }
  const strands = [[20, 460, -20], [90, 640, 30], [170, 380, 10], [240, 560, -30], [320, 300, 20], [400, 200, 10],
                   [1000, 220, -10], [1080, 320, -20], [1150, 560, 20], [1220, 400, -10], [1300, 660, -30], [1380, 480, 15]];
  strands.forEach(([x, len, sway], i) => {
    vine(bez([x, -10], [x + sway * .3, len * .3], [x + sway, len * .7], [x + sway * .6, len], 46), 50 - (i % 3) * 6, i % 3 ? 'euca' : 'sage');
  });
  vine(bez([0, 30], [180, 170], [380, 150], [560, 10], 60), 42, 'sage');
  vine(bez([840, 10], [1020, 160], [1220, 180], [1400, 30], 60), 42, 'euca');
</script></body></html>
