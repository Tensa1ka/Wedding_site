<!doctype html>
<html data-scale="1.6"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#art{display:block;width:720px;height:600px}</style></head>
<body>
<!-- Угловой букет для обложки (левый нижний угол; правый – зеркально в CSS) -->
<svg id="art" viewBox="0 0 720 600" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="ornament.js"></script><script src="flora.js"></script>
<script>
  const svg = document.getElementById('art'); const defs = setupDefs(svg); const g = el('g', {}, svg);
  seedRnd(21);
  // задний план: эвкалипт и листья
  eucalyptus(defs, g, bez([60, 600], [120, 470], [250, 330], [420, 250], 50), 17);
  eucalyptus(defs, g, bez([120, 600], [260, 520], [420, 470], [640, 470], 50), 15);
  eucalyptus(defs, g, bez([20, 600], [10, 470], [40, 300], [110, 170], 44), 15);
  anthLeaf(defs, g, 250, 430, .85, -128);
  anthLeaf(defs, g, 90, 420, .75, 168, 'euca');
  // стебли антуриумов
  stemBez(g, [120, 600], [160, 480], [230, 330], [290, 230], 4);
  stemBez(g, [60, 600], [70, 470], [90, 280], [120, 170], 4);
  stemBez(g, [180, 600], [260, 520], [380, 380], [470, 330], 4);
  anthurium(defs, g, 290, 228, 1.05, -22, 'lime', { spadix: -110, squash: .9 });
  anthurium(defs, g, 120, 170, .9, 18, 'white', { spadix: -70, skew: -6 });
  anthurium(defs, g, 470, 330, .78, -48, 'lime2', { spadix: -100, squash: .82 });
  // середина: гортензия, розы
  hydrangea(defs, g, 200, 470, 105, ['hydraW', 'hydraG']);
  rose(defs, g, 360, 500, 68, 'cream', 20);
  rose(defs, g, 70, 545, 58, 'white', -10);
  gyps(defs, g, 440, 330, 46);
  gyps(defs, g, 30, 360, 40, 22);
  // передний план
  rose(defs, g, 500, 560, 46, 'white', 50);
  eucalyptus(defs, g, bez([420, 600], [500, 596], [600, 590], [710, 548], 30), 13, 'euca', 4);
</script></body></html>
