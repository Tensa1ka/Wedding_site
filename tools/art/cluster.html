<!doctype html>
<html data-scale="1.6"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#art{display:block;width:440px;height:420px}</style></head>
<body>
<!-- Небольшой букет на угол рамы с программой -->
<svg id="art" viewBox="0 0 440 420" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="ornament.js"></script><script src="flora.js"></script>
<script>
  const svg = document.getElementById('art'); const defs = setupDefs(svg); const g = el('g', {}, svg);
  seedRnd(31);
  eucalyptus(defs, g, bez([200, 300], [260, 220], [330, 170], [430, 150], 40), 13);
  eucalyptus(defs, g, bez([200, 320], [140, 360], [80, 380], [10, 400], 36), 12);
  calla(defs, g, 250, 250, .85, 52, 'ivory');
  calla(defs, g, 240, 230, .8, 22, 'blush');
  anthLeaf(defs, g, 150, 230, .6, 130, 'euca');
  anthurium(defs, g, 150, 150, .8, 15, 'blush', { spadix: -70 });
  anthurium(defs, g, 210, 200, .7, -40, 'peach', { spadix: -110, squash: .8 });
  hydrangea(defs, g, 190, 320, 78, ['powder', 'misty'], { blushTint: true });
  rose(defs, g, 290, 330, 46, 'peach', 10);
  gyps(defs, g, 320, 250, 36, 24);
</script></body></html>
