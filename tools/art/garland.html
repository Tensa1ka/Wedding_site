<!doctype html>
<html data-scale="1.6"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#art{display:block;width:560px;height:700px}</style></head>
<body>
<!-- Свисающий букет для верхних углов арки (левый; правый – зеркально в CSS) -->
<svg id="art" viewBox="0 0 560 700" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="ornament.js"></script><script src="flora.js"></script>
<script>
  const svg = document.getElementById('art'); const defs = setupDefs(svg); const g = el('g', {}, svg);
  seedRnd(5);
  // свисающие ветви эвкалипта и нити амаранта
  eucalyptus(defs, g, bez([150, 120], [120, 260], [150, 420], [110, 600], 50), 15);
  eucalyptus(defs, g, bez([260, 120], [330, 200], [430, 220], [540, 200], 40), 14);
  eucalyptus(defs, g, bez([60, 60], [40, 180], [60, 300], [30, 420], 40), 13);
  amaranth(defs, g, 90, 180, 360, -30, 'rose');
  amaranth(defs, g, 200, 210, 470, 30, 'blush');
  amaranth(defs, g, 250, 200, 300, 60, 'rose');
  amaranth(defs, g, 140, 220, 260, 10, 'peach');
  anthLeaf(defs, g, 300, 110, .7, -100);
  anthLeaf(defs, g, 60, 140, .7, 30, 'euca');
  // шапка букета
  hydrangea(defs, g, 120, 90, 96, ['powder', 'misty']);
  anthurium(defs, g, 250, 60, .95, -35, 'rose', { spadix: -110 });
  rose(defs, g, 200, 175, 62, 'peach', 10);
  anthurium(defs, g, 40, 150, .8, 25, 'blush', { spadix: -70 });
  rose(defs, g, 330, 140, 48, 'blush', 30);
  gyps(defs, g, 360, 70, 44);
  gyps(defs, g, 60, 250, 36, 20);

</script></body></html>
