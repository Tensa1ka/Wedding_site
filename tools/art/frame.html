<!doctype html>
<html data-scale="1.5"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #art { display: block; width: 760px; height: 1300px; }
</style></head>
<body>
<!-- Рама-картуш из старого серебра: багет, бусины, гребни сверху и снизу -->
<svg id="art" viewBox="0 0 760 1300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9e5dc"/>
      <stop offset=".3" stop-color="#9d9484"/>
      <stop offset=".55" stop-color="#d6cfc2"/>
      <stop offset=".8" stop-color="#7b7163"/>
      <stop offset="1" stop-color="#bfb7a8"/>
    </linearGradient>
    <filter id="metal" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="7" diffuseConstant="1" lighting-color="#fff" result="d">
        <feDistantLight azimuth="235" elevation="38"/>
      </feDiffuseLighting>
      <feSpecularLighting in="b" surfaceScale="7" specularConstant="1.1" specularExponent="22" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="44"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.35" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="s" in2="lit" operator="arithmetic" k1="0" k2=".7" k3="1" k4="0" result="all"/>
      <feComposite in="all" in2="SourceAlpha" operator="in" result="allc"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="sb"/>
      <feOffset in="sb" dx="4" dy="10" result="so"/>
      <feFlood flood-color="#2c2a22" flood-opacity=".34"/>
      <feComposite in2="so" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="allc"/></feMerge>
    </filter>
    <filter id="metalFine" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="b"/>
      <feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1" lighting-color="#fff" result="d">
        <feDistantLight azimuth="235" elevation="40"/>
      </feDiffuseLighting>
      <feSpecularLighting in="b" surfaceScale="4" specularConstant="1.1" specularExponent="20" lighting-color="#ffffff" result="s">
        <feDistantLight azimuth="235" elevation="46"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.35" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="s" in2="lit" operator="arithmetic" k1="0" k2=".7" k3="1" k4="0" result="all"/>
      <feComposite in="all" in2="SourceAlpha" operator="in" result="allc"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="sb"/>
      <feOffset in="sb" dx="1.5" dy="3" result="so"/>
      <feFlood flood-color="#2c2a22" flood-opacity=".38"/>
      <feComposite in2="so" operator="in" result="sh"/>
      <feMerge><feMergeNode in="sh"/><feMergeNode in="allc"/></feMerge>
    </filter>
  </defs>
  <g id="band" fill="url(#g1)" filter="url(#metal)"></g>
  <g id="lip" fill="url(#g1)" filter="url(#metalFine)"></g>
  <g id="orn" fill="url(#g1)" filter="url(#metal)"></g>
  <g id="ornFine" fill="url(#g1)" filter="url(#metalFine)"></g>
</svg>
<script src="ornament.js"></script>
<script>
  const band = document.getElementById('band'), lip = document.getElementById('lip');
  const orn = document.getElementById('orn'), ornFine = document.getElementById('ornFine');
  const W = 760, CX = 380;
  // контур картуша с вогнутыми углами и арками по центру; d – отступ внутрь
  function cart(d) {
    const L = 70 + d, R = W - 70 - d, T = 170 + d, B = 1170 - d;
    const n = Math.max(8, 64 - d * .9);                 // радиус вогнутого угла
    const ah = Math.max(0, 46 - d * .55), aw = 120 - d * .4;   // высота и полуширина арки
    return `M${L} ${T + n}` +
      `A${n} ${n} 0 0 0 ${L + n} ${T}` +
      `L${CX - aw - 40} ${T}C${CX - aw + 10} ${T} ${CX - 50} ${T - ah} ${CX} ${T - ah}C${CX + 50} ${T - ah} ${CX + aw - 10} ${T} ${CX + aw + 40} ${T}` +
      `L${R - n} ${T}A${n} ${n} 0 0 0 ${R} ${T + n}` +
      `L${R} ${B - n}A${n} ${n} 0 0 0 ${R - n} ${B}` +
      `L${CX + aw + 40} ${B}C${CX + aw - 10} ${B} ${CX + 50} ${B + ah} ${CX} ${B + ah}C${CX - 50} ${B + ah} ${CX - aw + 10} ${B} ${CX - aw - 40} ${B}` +
      `L${L + n} ${B}A${n} ${n} 0 0 0 ${L} ${B - n}Z`;
  }
  const ring = (a, b, parent) => el('path', { d: cart(a) + cart(b), 'fill-rule': 'evenodd' }, parent);

  ring(0, 7, lip);          // внешний кант
  ring(10, 40, band);       // основной багет
  ring(43, 49, lip);        // внутренний кант

  // бусины между кантами
  const guide = el('path', { d: cart(8.5), fill: 'none' }, document.getElementById('art'));
  const len = guide.getTotalLength();
  for (let s = 0; s < len; s += 11) { const p = guide.getPointAtLength(s); el('circle', { cx: f(p.x), cy: f(p.y), r: 3.2 }, ornFine); }
  guide.remove();

  // насечки по багету
  const g2 = el('path', { d: cart(25), fill: 'none' }, document.getElementById('art'));
  const len2 = g2.getTotalLength();
  for (let s = 0; s < len2; s += 26) {
    const p = g2.getPointAtLength(s), q = g2.getPointAtLength(Math.min(len2, s + 1));
    const a = Math.atan2(q.y - p.y, q.x - p.x);
    el('path', { d: leaf(p.x - Math.cos(a) * 8, p.y - Math.sin(a) * 8, 18, 6, a, 0) }, ornFine);
  }
  g2.remove();

  function mirrored(build, parent) {
    build(el('g', {}, parent));
    build(el('g', { transform: `translate(${W} 0) scale(-1 1)` }, parent));
  }

  // верхний гребень: раковина-пальметта и завитки
  const T = 170;
  mirrored(g => {
    let p = bez([CX - 6, T - 40], [CX - 50, T - 120], [CX - 150, T - 120], [CX - 176, T - 60], 40);
    el('path', { d: ribbon(curl(p, 20, 1.1, -1), 20, 6, 22) }, g);
    p = bez([CX - 20, T - 30], [CX - 90, T - 20], [CX - 170, T - 10], [CX - 240, T - 34], 34);
    el('path', { d: ribbon(curl(p, 15, 1.0, 1), 16, 4) }, g);
    [[CX - 100, T - 112, -2.8, 44], [CX - 150, T - 102, -2.3, 38], [CX - 60, T - 92, -2.3, 40], [CX - 130, T - 18, 3.0, 40]].forEach(([x, y, a, L]) => el('path', { d: leaf(x, y, L, 13, a) }, g));
  }, orn);
  mirrored(g => {
    [-1.32, -1.12, -.92, -.72].forEach((a, k) => el('path', { d: leaf(CX - 2, T - 46, 96 - k * 14, 17 - k * 2, a * Math.PI / 2, .08) }, g));
  }, ornFine);
  el('path', { d: leaf(CX, T - 46, 110, 18, -Math.PI / 2, 0) }, ornFine);
  el('ellipse', { cx: CX, cy: T - 40, rx: 22, ry: 16 }, orn);

  // нижний гребень
  const B = 1170;
  mirrored(g => {
    let p = bez([CX - 6, B + 38], [CX - 50, B + 110], [CX - 150, B + 110], [CX - 176, B + 54], 40);
    el('path', { d: ribbon(curl(p, 18, 1.1, 1), 18, 5, 20) }, g);
    [[CX - 100, B + 104, 2.8, 40], [CX - 150, B + 94, 2.4, 34], [CX - 56, B + 90, 2.3, 36]].forEach(([x, y, a, L]) => el('path', { d: leaf(x, y, L, 12, a) }, g));
  }, orn);
  for (let k = 0; k < 10; k++) el('path', { d: leaf(CX, B + 44, 34, 11, k / 10 * Math.PI * 2 + .3) }, ornFine);
  el('circle', { cx: CX, cy: B + 44, r: 12 }, orn);

  // розетки в вогнутых углах
  [[70, T, 1, 1], [W - 70, T, -1, 1], [70, B, 1, -1], [W - 70, B, -1, -1]].forEach(([cx0, cy0, sx, sy]) => {
    const x = cx0 + sx * 34, y = cy0 + sy * 34;
    for (let k = 0; k < 8; k++) el('path', { d: leaf(x, y, 24, 9, k / 8 * Math.PI * 2) }, ornFine);
    el('circle', { cx: x, cy: y, r: 9 }, orn);
  });
</script>
</body></html>
