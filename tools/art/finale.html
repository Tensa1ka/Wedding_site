<!doctype html>
<html data-scale="1.4"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#art{display:block;width:1400px;height:700px}</style></head>
<body>
<!-- Финальная композиция: каменная ваза с цветами, низкие букеты, рассыпанные лепестки -->
<svg id="art" viewBox="0 0 1400 700" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="ornament.js"></script><script src="flora.js"></script>
<script>
  const svg = document.getElementById('art'); const defs = setupDefs(svg); const g = el('g', {}, svg);
  seedRnd(44);
  defs.insertAdjacentHTML('beforeend', `
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8968a"/><stop offset=".22" stop-color="#e9ded3"/><stop offset=".45" stop-color="#f3ebe2"/>
      <stop offset=".75" stop-color="#cbbcaf"/><stop offset="1" stop-color="#97857a"/>
    </linearGradient>
    <filter id="stoneTex" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".05 .2" numOctaves="3" seed="6"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .32  0 0 0 .35 -.05"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="floorShadow"><stop offset="0" stop-color="#6d5547" stop-opacity=".35"/><stop offset="1" stop-color="#6d5547" stop-opacity="0"/></radialGradient>`);

  // классическая ваза: профиль, отражённый по оси
  function urn(x, y, s) {
    const prof = [[0, 0], [70, 0], [70, 10], [50, 18], [44, 34], [56, 40], [56, 48], [30, 56], [26, 80], [40, 104], [92, 150], [118, 210], [112, 262], [84, 300], [50, 316], [56, 326], [96, 334], [104, 346], [0, 346]];
    const pts = prof.map(([px, py]) => [px, -py]);
    let d = 'M' + pts.map(p => f(x + p[0] * s) + ' ' + f(y + p[1] * s)).join('L');
    d += 'L' + pts.slice().reverse().map(p => f(x - p[0] * s) + ' ' + f(y + p[1] * s)).join('L') + 'Z';
    el('ellipse', { cx: x, cy: y + 6, rx: 150 * s, ry: 22 * s, fill: 'url(#floorShadow)' }, g);
    el('path', { d, fill: 'url(#stone)', filter: 'url(#fShadow)' }, g);
    el('path', { d, fill: '#fff', filter: 'url(#stoneTex)' }, g);
    // бортики и гирлянда-рельеф
    [[10, 70], [48, 56], [334, 96], [346, 104]].forEach(([py, w]) => el('rect', { x: x - w * s, y: y - py * s - 2, width: w * 2 * s, height: 4, fill: '#fff', opacity: .35 }, g));
    for (let k = -3; k <= 3; k++) el('path', { d: `M${x + k * 28 * s - 14 * s} ${y - 226 * s}q${14 * s} ${18 * s} ${28 * s} 0`, fill: 'none', stroke: '#8f7e72', 'stroke-opacity': .45, 'stroke-width': 2.2 }, g);
  }

  // левый низкий букет
  eucalyptus(defs, g, bez([40, 700], [60, 600], [140, 520], [250, 470], 40), 15);
  amaranth(defs, g, 160, 520, 200, -40, 'rose');
  anthLeaf(defs, g, 180, 560, .7, -120);
  anthurium(defs, g, 120, 520, .85, 15, 'peach', { spadix: -70 });
  hydrangea(defs, g, 210, 600, 92, ['powder', 'misty']);
  rose(defs, g, 90, 640, 60, 'blush', 10);
  rose(defs, g, 320, 650, 52, 'peach', 40);
  gyps(defs, g, 60, 560, 40, 20);

  // ваза по центру и букет в ней
  const ux = 640, uy = 690, us = .92;
  urn(ux, uy, us);
  const urnTop = uy - 346 * us;
  eucalyptus(defs, g, bez([ux - 30, urnTop + 20], [ux - 160, urnTop - 40], [ux - 260, urnTop - 10], [ux - 330, urnTop + 80], 44), 15);
  eucalyptus(defs, g, bez([ux + 30, urnTop + 20], [ux + 170, urnTop - 50], [ux + 270, urnTop - 10], [ux + 340, urnTop + 90], 44), 15);
  amaranth(defs, g, ux + 100, urnTop + 10, 320, 70, 'rose');
  amaranth(defs, g, ux - 110, urnTop + 10, 260, -50, 'blush');
  amaranth(defs, g, ux + 40, urnTop + 30, 220, 20, 'peach');
  anthLeaf(defs, g, ux - 60, urnTop - 20, .8, -150);
  anthLeaf(defs, g, ux + 90, urnTop - 10, .75, 150, 'euca');
  calla(defs, g, ux - 20, urnTop - 60, .9, -18, 'ivory');
  calla(defs, g, ux + 40, urnTop - 70, .85, 16, 'blush');
  anthurium(defs, g, ux - 140, urnTop - 110, .95, 25, 'rose', { spadix: -70 });
  anthurium(defs, g, ux + 150, urnTop - 120, .9, -25, 'blush', { spadix: -110 });
  anthurium(defs, g, ux + 20, urnTop - 230, .8, -5, 'peach', { spadix: -100 });
  hydrangea(defs, g, ux - 70, urnTop - 20, 92, ['powder', 'misty'], { blushTint: true });
  hydrangea(defs, g, ux + 110, urnTop - 10, 80, ['powder', 'misty']);
  rose(defs, g, ux + 10, urnTop + 10, 64, 'peach', 15);
  rose(defs, g, ux - 170, urnTop + 20, 50, 'blush', 30);
  rose(defs, g, ux + 200, urnTop + 30, 48, 'blush', -20);
  gyps(defs, g, ux - 200, urnTop - 80, 46);
  gyps(defs, g, ux + 230, urnTop - 90, 46);

  // правый низкий букет
  eucalyptus(defs, g, bez([1380, 700], [1340, 600], [1260, 520], [1140, 480], 40), 15);
  eucalyptus(defs, g, bez([1300, 700], [1200, 640], [1100, 640], [980, 660], 40), 13);
  amaranth(defs, g, 1230, 520, 170, 40, 'blush');
  anthurium(defs, g, 1260, 520, .85, -15, 'rose', { spadix: -110 });
  anthurium(defs, g, 1120, 560, .7, -40, 'blush', { spadix: -100 });
  hydrangea(defs, g, 1180, 610, 90, ['powder', 'misty'], { blushTint: true });
  rose(defs, g, 1310, 640, 58, 'peach', 25);
  rose(defs, g, 1060, 660, 46, 'blush', 5);
  gyps(defs, g, 1340, 560, 40, 20);
  // лепестки на полу
  [[420, 690, 'blush'], [470, 684, 'peach'], [860, 692, 'rose'], [905, 686, 'blush'], [960, 694, 'peach']].forEach(([x, y, k], i) => {
    el('ellipse', { cx: x, cy: y, rx: 12, ry: 6, fill: PAL[k].mid, transform: `rotate(${i * 37} ${x} ${y})`, filter: 'url(#fShadowSm)' }, g);
  });
</script></body></html>
