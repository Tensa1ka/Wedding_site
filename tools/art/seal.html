<!doctype html>
<html data-scale="1.6"><head><meta charset="utf-8">
<style>
  @font-face { font-family: GV; src: url(../../assets/fonts/greatvibes-cyr.woff2) format('woff2'); unicode-range: U+0400-045F; }
  @font-face { font-family: GV; src: url(../../assets/fonts/greatvibes-lat.woff2) format('woff2'); }
  @font-face { font-family: CG; src: url(../../assets/fonts/cormorant-cyr.woff2) format('woff2'); unicode-range: U+0400-045F; font-weight: 300 700; }
  @font-face { font-family: CG; src: url(../../assets/fonts/cormorant-lat.woff2) format('woff2'); font-weight: 300 700; }
  html, body { margin: 0; background: transparent; }
  #art { display: block; width: 640px; height: 640px; }
  text { font-family: GV; }
</style></head>
<body>
<!-- Восковая печать мягкого золота с монограммой Ф И -->
<svg id="art" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="blob" d=""/>
    <clipPath id="blobClip"><use href="#blob"/></clipPath>

    <radialGradient id="wax" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#f3dcaa"/>
      <stop offset=".4" stop-color="#c79a55"/>
      <stop offset=".78" stop-color="#8f6630"/>
      <stop offset="1" stop-color="#5e4020"/>
    </radialGradient>

    <filter id="soft12" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="1.6"/></filter>

    <!-- карта высот → свет и блики -->
    <filter id="relief" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="9" diffuseConstant=".95" lighting-color="#fff" result="diff">
        <feDistantLight azimuth="235" elevation="48"/>
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="9" specularConstant=".9" specularExponent="30" lighting-color="#fff6dc" result="spec">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <feFlood flood-color="#bf9150" result="col"/>
      <feComposite in="col" in2="diff" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="spec" in2="lit" operator="arithmetic" k1="0" k2=".55" k3="1" k4="0"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feOffset dx="6" dy="18" result="o"/>
      <feFlood flood-color="#3d1d1f" flood-opacity=".55"/>
      <feComposite in2="o" operator="in"/>
    </filter>
    <filter id="contact" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dx="2" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer>
    </filter>
    <filter id="hnoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .25  0 0 0 .22 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- тень -->
  <use href="#blob" filter="url(#shadow)"/>
  <use href="#blob" filter="url(#contact)"/>


  <g clip-path="url(#blobClip)">
    <g filter="url(#relief)">
      <rect width="640" height="640" fill="#000"/>
      <!-- край воска скруглён -->
      <use href="#blob" fill="#8a8a8a" filter="url(#soft12)"/>
      <rect width="640" height="640" filter="url(#hnoise)" opacity=".09"/>
      <!-- выдавленный круг печати -->
      <circle cx="320" cy="320" r="205" fill="#9c9c9c" filter="url(#soft4)"/>
      <circle cx="320" cy="320" r="190" fill="#5e5e5e" filter="url(#soft4)"/>
      <!-- тонкий ободок и бусины -->
      <circle cx="320" cy="320" r="172" fill="none" stroke="#8a8a8a" stroke-width="3" filter="url(#soft2)"/>
      <g id="beads" filter="url(#soft2)"></g>
      <!-- монограмма -->
      <g filter="url(#soft2)" fill="#ababab" stroke="#ababab" stroke-width="2.4">
        <text x="248" y="350" font-size="176" text-anchor="middle">Ф</text>
        <text x="394" y="386" font-size="176" text-anchor="middle">И</text>
        <text x="322" y="368" font-size="66" text-anchor="middle" fill="#9a9a9a">&amp;</text>
      </g>
      <!-- веточка под монограммой -->
      <g filter="url(#soft2)" fill="none" stroke="#9a9a9a" stroke-width="3.2" stroke-linecap="round">
        <path d="M232 448 C 280 470, 360 470, 408 448"/>
        <path d="M262 458 q -16 -16 -36 -10 M290 465 q -10 -20 -30 -20 M350 465 q 10 -20 30 -20 M378 458 q 16 -16 36 -10"/>
      </g>
    </g>
    <!-- объём цвета: светлее к свету, глубже в тени -->
    <rect width="640" height="640" fill="url(#wax)" style="mix-blend-mode:soft-light" opacity=".9"/>
    <!-- лёгкая фактура -->
    <rect width="640" height="640" fill="#fff" filter="url(#grain)" opacity=".6" style="mix-blend-mode:multiply"/>
  </g>
</svg>
<script>
  // неровный край воска (детерминированный «шум»)
  let s = 9;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const N = 140, cx = 320, cy = 320, R = 268;
  const harm = Array.from({ length: 9 }, (_, i) => ({ k: i + 2, a: (rnd() * 2 - 1) * (i < 3 ? 9 : 4.5) / (1 + i * .35), p: rnd() * 6.28 }));
  const bumps = Array.from({ length: 5 }, () => ({ t: rnd() * 6.28, a: 10 + rnd() * 16, w: .12 + rnd() * .16 }));
  const pts = [];
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2;
    let r = R;
    harm.forEach(h => { r += h.a * Math.sin(h.k * t + h.p); });
    bumps.forEach(b => { let d = Math.atan2(Math.sin(t - b.t), Math.cos(t - b.t)); r += b.a * Math.exp(-(d * d) / (b.w * b.w)); });
    pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
  }
  // сглаженный замкнутый путь (Catmull-Rom → Безье)
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < N; i++) {
    const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  document.getElementById('blob').setAttribute('d', d + 'Z');
  // бусины по кругу
  const g = document.getElementById('beads');
  for (let i = 0; i < 48; i++) {
    const t = i / 48 * Math.PI * 2;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', 320 + 158 * Math.cos(t)); c.setAttribute('cy', 320 + 158 * Math.sin(t));
    c.setAttribute('r', 3.4); c.setAttribute('fill', '#8e8e8e');
    g.appendChild(c);
  }
</script>
</body></html>
