<!doctype html>
<html data-scale="1.6"><head><meta charset="utf-8">
<style>
  @font-face { font-family: GV; src: url(../../assets/fonts/greatvibes-cyr.woff2) format('woff2'); unicode-range: U+0400-045F; }
  @font-face { font-family: GV; src: url(../../assets/fonts/greatvibes-lat.woff2) format('woff2'); }
  @font-face { font-family: CG; src: url(../../assets/fonts/cormorant-cyr.woff2) format('woff2'); unicode-range: U+0400-045F; font-weight: 300 700; }
  @font-face { font-family: CG; src: url(../../assets/fonts/cormorant-lat.woff2) format('woff2'); font-weight: 300 700; }
  html, body { margin: 0; background: transparent; }
  #art { display: block; width: 640px; height: 640px; }
  text { font-family: GV; }
</style></head>
<body>
<!-- Восковая печать цвета слоновой кости с двумя лилиями -->
<svg id="art" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="blob" d=""/>
    <clipPath id="blobClip"><use href="#blob"/></clipPath>

    <radialGradient id="wax" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#e9e3d7"/>
      <stop offset=".8" stop-color="#b9b1a2"/>
      <stop offset="1" stop-color="#8d8577"/>
    </radialGradient>

    <filter id="soft12" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="1.6"/></filter>

    <!-- карта высот → свет и блики -->
    <filter id="relief" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="9" diffuseConstant="1" lighting-color="#fff" result="diff">
        <feDistantLight azimuth="235" elevation="48"/>
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="9" specularConstant=".75" specularExponent="18" lighting-color="#ffffff" result="spec">
        <feDistantLight azimuth="235" elevation="52"/>
      </feSpecularLighting>
      <feFlood flood-color="#efe9de" result="col"/>
      <feComposite in="col" in2="diff" operator="arithmetic" k1="1.05" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="spec" in2="lit" operator="arithmetic" k1="0" k2=".55" k3="1" k4="0"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="b"/>
      <feOffset dx="6" dy="18" result="o"/>
      <feFlood flood-color="#070800" flood-opacity=".7"/>
      <feComposite in2="o" operator="in"/>
    </filter>
    <filter id="contact" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feOffset dx="2" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".6"/></feComponentTransfer>
    </filter>
    <filter id="hnoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .48  0 0 0 0 .44  0 0 0 .14 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- тень -->
  <use href="#blob" filter="url(#shadow)"/>
  <use href="#blob" filter="url(#contact)"/>


  <g clip-path="url(#blobClip)">
    <g filter="url(#relief)">
      <rect width="640" height="640" fill="#000"/>
      <!-- край воска скруглён -->
      <use href="#blob" fill="#8a8a8a" filter="url(#soft12)"/>
      <rect width="640" height="640" filter="url(#hnoise)" opacity=".09"/>
      <!-- выдавленный круг печати -->
      <circle cx="320" cy="320" r="205" fill="#9c9c9c" filter="url(#soft4)"/>
      <circle cx="320" cy="320" r="190" fill="#5e5e5e" filter="url(#soft4)"/>
      <!-- тонкий ободок -->
      <circle cx="320" cy="320" r="176" fill="none" stroke="#808080" stroke-width="3" filter="url(#soft2)"/>
      <!-- лилии -->
      <g id="lilies" filter="url(#soft2)"></g>
    </g>
    <!-- объём цвета: светлее к свету, глубже в тени -->
    <rect width="640" height="640" fill="url(#wax)" style="mix-blend-mode:soft-light" opacity=".9"/>
    <!-- лёгкая фактура -->
    <rect width="640" height="640" fill="#fff" filter="url(#grain)" opacity=".6" style="mix-blend-mode:multiply"/>
  </g>
</svg>
<script src="ornament.js"></script>
<script>
  // неровный край воска (детерминированный «шум»)
  let s = 9;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const N = 140, cx = 320, cy = 320, R = 268;
  const harm = Array.from({ length: 9 }, (_, i) => ({ k: i + 2, a: (rnd() * 2 - 1) * (i < 3 ? 9 : 4.5) / (1 + i * .35), p: rnd() * 6.28 }));
  const bumps = Array.from({ length: 5 }, () => ({ t: rnd() * 6.28, a: 10 + rnd() * 16, w: .12 + rnd() * .16 }));
  const pts = [];
  for (let i = 0; i < N; i++) {
    const t = i / N * Math.PI * 2;
    let r = R;
    harm.forEach(h => { r += h.a * Math.sin(h.k * t + h.p); });
    bumps.forEach(b => { let d = Math.atan2(Math.sin(t - b.t), Math.cos(t - b.t)); r += b.a * Math.exp(-(d * d) / (b.w * b.w)); });
    pts.push([cx + r * Math.cos(t), cy + r * Math.sin(t)]);
  }
  // сглаженный замкнутый путь (Catmull-Rom → Безье)
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < N; i++) {
    const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  document.getElementById('blob').setAttribute('d', d + 'Z');
  // лилии: стебли, листья, два раскрытых цветка и бутон по центру
  const L = document.getElementById('lilies');
  const add = (tag, at) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in at) e.setAttribute(k, at[k]); L.appendChild(e); return e; };
  const STEM = '#8c8c8c', LO = '#8f8f8f', HI = '#b4b4b4', GROOVE = '#727272';
  // стебли
  add('path', { d: 'M320 470 C318 400 318 300 320 214', fill: 'none', stroke: STEM, 'stroke-width': 7, 'stroke-linecap': 'round' });
  add('path', { d: 'M320 440 C304 400 288 360 276 322', fill: 'none', stroke: STEM, 'stroke-width': 6, 'stroke-linecap': 'round' });
  add('path', { d: 'M320 440 C336 400 352 360 364 322', fill: 'none', stroke: STEM, 'stroke-width': 6, 'stroke-linecap': 'round' });
  // листья
  add('path', { d: leaf(318, 466, 108, 24, -2.6, .35), fill: LO });
  add('path', { d: leaf(322, 466, 108, 24, -.54, -.35), fill: LO });
  
  [[-2.55, .35, 120], [-.59, -.35, 120]].forEach(([a, b, l]) => {
    add('path', { d: `M320 462 l${Math.cos(a) * l * .8} ${Math.sin(a) * l * .8}`, stroke: GROOVE, 'stroke-width': 2, fill: 'none' });
  });
  // бутон
  add('path', { d: 'M320 222 C298 200 300 162 320 134 C340 162 342 200 320 222Z', fill: HI });
  add('path', { d: 'M320 220 C314 192 314 162 320 138', stroke: GROOVE, 'stroke-width': 2, fill: 'none' });
  add('path', { d: 'M320 222 C306 216 300 198 304 182', stroke: GROOVE, 'stroke-width': 1.6, fill: 'none' });
  // цветок: шесть лепестков веером, задние ниже передних, у каждого бороздка-жилка
  function lily(cx, cy, dir, s) {
    const back = [-1.95, -1.35, -.75], front = [-2.3, -1.05, .05];
    back.forEach(a => {
      const ang = dir > 0 ? a : -Math.PI - a;
      add('path', { d: leaf(cx, cy, 80 * s, 21 * s, ang, .35 * dir), fill: LO });
    });
    front.forEach((a, i) => {
      const ang = dir > 0 ? a : -Math.PI - a;
      add('path', { d: leaf(cx, cy, 90 * s, 26 * s, ang, (i === 1 ? .2 : .5) * dir), fill: HI });
      add('path', { d: `M${cx} ${cy} l${Math.cos(ang) * 70 * s} ${Math.sin(ang) * 70 * s}`, stroke: GROOVE, 'stroke-width': 1.8, fill: 'none' });
    });
    // тычинки
    for (let k = 0; k < 5; k++) {
      const ang = (dir > 0 ? -1.6 : -1.54) + (k - 2) * .22;
      const x2 = cx + Math.cos(ang) * 58 * s, y2 = cy + Math.sin(ang) * 58 * s;
      add('path', { d: `M${cx} ${cy} Q${cx + Math.cos(ang) * 30 * s + 4 * dir} ${cy + Math.sin(ang) * 30 * s} ${x2} ${y2}`, stroke: '#9c9c9c', 'stroke-width': 2.2, fill: 'none' });
      add('ellipse', { cx: x2, cy: y2, rx: 5, ry: 3, fill: '#bdbdbd', transform: `rotate(${ang * 57.3} ${x2} ${y2})` });
    }
    add('circle', { cx, cy, r: 9 * s, fill: '#a0a0a0' });
  }
  lily(272, 318, -1, 1.05);
  lily(368, 318, 1, 1.05);
</script>
</body></html>
